name: mmmovies
description: "MMMovies - App ya kutazama movies kwa kulipia. Tawi la MMEmpire / MMMedia."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  video_player: ^2.9.1
  chewie: ^1.8.5
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
